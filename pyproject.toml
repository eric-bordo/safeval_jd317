[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eric-bordo-safeval_jd317"
version = "0.1.0"
description = "从样本里推断模型安全评测负责人·成本与吞吐的帕累托边界应有的字段集合，逐字段检查存在性与类型，缺失项单独列出"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "eric-bordo" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://eric-bordo.github.io"
Repository = "https://github.com/eric-bordo/safeval_jd317"
Issues = "https://github.com/eric-bordo/safeval_jd317/issues"

[project.scripts]
safeval_jd317 = "safeval_jd317:main"

[tool.setuptools]
py-modules = ["safeval_jd317"]
